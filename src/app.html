<!doctype html>
<html lang="%linkrovia.locale%" data-theme="%linkrovia.theme%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/brand/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/brand/icon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="%sveltekit.assets%/brand/icon-192.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#0D1729" />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
